<svg viewBox="0 0 800 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 2px;
      rx: 16px;
    }
    .title {
      font-family: Georgia, serif;
      font-size: 20px;
      fill: #ffffff;
      font-weight: bold;
    }
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      fill: #b2c1d8;
    }
    .highlight {
      fill: #ffffff;
    }
    .icon {
      fill: none;
      stroke: #b2c1d8;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dot {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>

  <rect width="800" height="120" class="card-bg" />

  <circle cx="50" cy="40" r="6" class="highlight dot" />
  <text x="75" y="46" class="title">Current Status</text>
  

  <g transform="translate(45, 75) scale(0.7)">
    <path class="icon" d="m16 18 6-6-6-6M8 6l-6 6 6 6" />
  </g>
  <text x="80" y="90" class="text">Working on: <tspan fill="#ffffff"> Customization &amp; Code Journey</tspan></text>
</svg>
