<svg width="850" height="160" viewBox="0 0 850 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .float { animation: floatAnim 4s ease-in-out infinite; transform-origin: center; }
    .d1 { animation-delay: 0.0s; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.4s; }
    .d4 { animation-delay: 0.6s; }
    .d5 { animation-delay: 0.8s; }
    
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    
    .glass-box {
      fill: url(#glass-fill);
      stroke: url(#glass-border);
      stroke-width: 1.5;
    }
    
    .icon-text {
      fill: #222222;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 18px;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 0.5px;
    }
    
    .icon-path { stroke: #222222; fill: none; }
    .icon-fill { fill: #222222; }
    
    .label {
      fill: #666666;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
      text-anchor: middle;
      letter-spacing: 1.5px;
    }
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- HTML -->
  <g transform="translate(210, 35)">
    <g class="float d1">
      <rect x="0" y="0" width="70" height="70" rx="20" class="glass-box" filter="url(#shadow)" />
      <text x="35" y="38" class="icon-text">HTML</text>
      <text x="35" y="95" class="label">HTML</text>
    </g>
  </g>

  <!-- CSS -->
  <g transform="translate(300, 35)">
    <g class="float d2">
      <rect x="0" y="0" width="70" height="70" rx="20" class="glass-box" filter="url(#shadow)" />
      <text x="35" y="38" class="icon-text">CSS</text>
      <text x="35" y="95" class="label">CSS</text>
    </g>
  </g>

  <!-- JS -->
  <g transform="translate(390, 35)">
    <g class="float d3">
      <rect x="0" y="0" width="70" height="70" rx="20" class="glass-box" filter="url(#shadow)" />
      <text x="35" y="38" class="icon-text" font-size="24">JS</text>
      <text x="35" y="95" class="label">JAVASCRIPT</text>
    </g>
  </g>

  <!-- React -->
  <g transform="translate(480, 35)">
    <g class="float d4">
      <rect x="0" y="0" width="70" height="70" rx="20" class="glass-box" filter="url(#shadow)" />
      <g transform="translate(35, 35)">
        <ellipse rx="15" ry="5.5" class="icon-path" stroke-width="2.5" transform="rotate(30)"/>
        <ellipse rx="15" ry="5.5" class="icon-path" stroke-width="2.5" transform="rotate(90)"/>
        <ellipse rx="15" ry="5.5" class="icon-path" stroke-width="2.5" transform="rotate(150)"/>
        <circle cx="0" cy="0" r="3.5" class="icon-fill"/>
      </g>
      <text x="35" y="95" class="label">REACT</text>
    </g>
  </g>

  <!-- C++ -->
  <g transform="translate(570, 35)">
    <g class="float d5">
      <rect x="0" y="0" width="70" height="70" rx="20" class="glass-box" filter="url(#shadow)" />
      <text x="35" y="38" class="icon-text" font-size="20">C++</text>
      <text x="35" y="95" class="label">C++</text>
    </g>
  </g>
</svg>
